<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Income Bot - Premium Dashboard</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- FontAwesome for Binance & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --text-color: #ffffff;
            --accent-glow: linear-gradient(45deg, #00ff87, #60efff, #ff007f, #7928ca);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 15px;
        }

        /* Background Animated Glow */
        .bg-animation {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(121, 40, 202, 0.15) 0%, rgba(13, 17, 23, 1) 70%);
            z-index: -1;
            animation: rotateBg 15s linear infinite;
        }

        @keyframes rotateBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            background-clip: padding-box;
            position: relative;
        }

        /* Glowing Border Animation */
        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: var(--accent-glow);
            background-size: 300% 300%;
            z-index: -1;
            border-radius: 26px;
            animation: glowingBorder 6s ease infinite;
        }

        @keyframes glowingBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Profile Header */
        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar-box {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 3px;
            background: var(--accent-glow);
            animation: glowingBorder 4s linear infinite;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-header h1 {
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00ff87, #60efff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-header p {
            font-size: 13px;
            color: #8b949e;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #8b949e;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00ff87, #60efff);
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 255, 135, 0.4);
        }

        /* Content Sections */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Stats Card */
        .stats-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .stats-card h3 {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 5px;
        }

        .stats-card .amount {
            font-size: 24px;
            font-weight: bold;
            color: #00ff87;
        }

        /* Form Inputs & Buttons */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #c9d1d9;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #f3ba2f; /* Binance Yellow */
            font-size: 18px;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 15px 12px 45px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #f3ba2f;
            box-shadow: 0 0 10px rgba(243, 186, 47, 0.3);
        }

        .action-btn {
            width: 100%;
            background: linear-gradient(135deg, #f3ba2f, #ff8c00);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(243, 186, 47, 0.4);
            margin-top: 10px;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Referral Link Box */
        .ref-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .ref-box span {
            font-size: 13px;
            color: #8b949e;
            word-break: break-all;
            margin-right: 10px;
        }

        .copy-btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="container">
        <!-- Header Profile -->
        <div class="profile-header">
            <div class="avatar-box">
                <img src="https://i.imgur.com/8Q9W4Xv.png" alt="CEO Logo" id="userAvatar">
            </div>
            <h1 id="userName">ARIFUL-CEO</h1>
            <p>Task Income & Crypto Ecosystem</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i> Home</button>
            <button class="tab-btn" onclick="switchTab('withdraw', this)"><i class="fa-solid fa-wallet"></i> Withdraw</button>
            <button class="tab-btn" onclick="switchTab('referral', this)"><i class="fa-solid fa-users"></i> Referral</button>
        </div>

        <!-- Home Section -->
        <div id="home" class="section active">
            <div class="stats-card">
                <h3>Total Balance</h3>
                <div class="amount" id="totalBalance">$125.50</div>
            </div>
            <div class="stats-card">
                <h3>Completed Tasks</h3>
                <div class="amount" style="color: #60efff;" id="taskCount">42</div>
            </div>
            <button class="action-btn" style="background: linear-gradient(135deg, #00ff87, #60efff); color: #000;" onclick="switchTab('withdraw', null)">Withdraw Funds Now</button>
        </div>

        <!-- Withdraw Section (Binance UID) -->
        <div id="withdraw" class="section">
            <div class="stats-card">
                <h3>Available for Withdraw</h3>
                <div class="amount" id="withdrawBalance">$125.50</div>
            </div>
            <div class="input-group">
                <label>Enter Your Binance UID</label>
                <div class="input-wrapper">
                    <i class="fa-brands fa-bitcoin"></i> <!-- Binance Theme Icon -->
                    <input type="number" id="binanceUid" placeholder="e.g., 893281027">
                </div>
            </div>
            <button class="action-btn" onclick="requestWithdraw()">Submit Withdrawal</button>
        </div>

        <!-- Referral Section -->
        <div id="referral" class="section">
            <div class="stats-card">
                <h3>Referral Balance (Admin Controlled)</h3>
                <div class="amount" id="refBalance">$15.00</div>
            </div>
            <div class="input-group">
                <label>Your Invite Link</label>
                <div class="ref-box">
                    <span id="refLink">https://t.me/Task_iincome_BOT?start=ref12345</span>
                    <button class="copy-btn" onclick="copyRef()">Copy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab Switcher Logic
        function switchTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if(btn) {
                btn.classList.add('active');
            } else {
                // If triggered via button click, highlight matching tab
                const tabs = document.querySelectorAll('.tab-btn');
                if(tabId === 'home') tabs[0].classList.add('active');
                if(tabId === 'withdraw') tabs[1].classList.add('active');
                if(tabId === 'referral') tabs[2].classList.add('active');
            }
        }

        // Withdraw Action
        function requestWithdraw() {
            const uid = document.getElementById('binanceUid').value;
            if(!uid || uid.length < 5) {
                alert('দয়া করে আপনার সঠিক Binance UID লিখুন!');
                return;
            }
            alert('উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে! Binance UID: ' + uid);
        }

        // Copy Referral Link
        function copyRef() {
            const link = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(link);
            alert('রেফারেল লিংক কপি করা হয়েছে!');
        }

        // Telegram WebApp Init
        window.Telegram.WebApp.ready();
        const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
        if(tgUser && tgUser.first_name) {
            document.getElementById('userName').innerText = tgUser.first_name + "-CEO";
        }
    </script>
</body>
</html>
